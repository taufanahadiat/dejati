services:
  # --- PHP + Apache web app ---
  web:
    build: .
    container_name: lampp_web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - proxy
      - whatsapp_private

  whatsapp:
    build: ./services/whatsapp
    restart: unless-stopped
    init: true
    shm_size: 256mb
    stop_grace_period: 30s
    volumes:
      - whatsapp_data:/data
      - ./config/whatsapp-bot.token:/run/secrets/stock-token:ro
    networks:
      - whatsapp_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- MySQL database ---
  db:
    image: mysql:8.0
    container_name: lampp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: akpidev3
      MYSQL_DATABASE: dejati
      TZ: Asia/Jakarta
    command: --default-time-zone='Asia/Jakarta'
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - proxy

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lampp_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://192.168.100.161/phpmyadmin/
      UPLOAD_LIMIT: 64M
    networks:
      - proxy

  # --- Caddy (auto HTTPS reverse proxy) ---
  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  whatsapp_data:
  db_data:
  caddy_data:
  caddy_config:

networks:
  whatsapp_private:
    driver: bridge
  proxy:
    driver: bridge
