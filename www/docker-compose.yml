services:
  # --- PHP + Apache web app ---
  web:
    build: .
    container_name: lampp_web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - proxy

  # --- MySQL database ---
  db:
    image: mysql:8.0
    container_name: lampp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: akpidev3
      MYSQL_DATABASE: dejati
      TZ: Asia/Jakarta
    command: --default-time-zone='Asia/Jakarta'
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - proxy

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lampp_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://192.168.100.161/phpmyadmin/
      UPLOAD_LIMIT: 64M
    networks:
      - proxy

  # --- Caddy (auto HTTPS reverse proxy) ---
  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    driver: bridge
