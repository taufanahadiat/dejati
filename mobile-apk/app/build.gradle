plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dejaticoffee.pos'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.dejaticoffee.pos'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://api.dejaticoffee.com"'
    }
}
